<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t8 d8">
  <title id="t8">Prelude Spring 26 Anchoring</title>
  <desc id="d8">University freshman orientation lead stage hosting for Prelude Spring 2026</desc>
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#193339"/>
      <stop offset="100%" stop-color="#101a1e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg8)"/>
  <circle cx="510" cy="100" r="140" fill="#aee7d5" opacity="0.18"/>
  <circle cx="120" cy="300" r="140" fill="#a9d6f7" opacity="0.15"/>
  
  <polygon points="320,0 120,400 520,400" fill="#ffffff" opacity="0.04"/>
  
  <!-- Spring Sunrise / Stage Motif -->
  <g transform="translate(320,135)">
    <!-- Sun / arc rays -->
    <path d="M-40,0 C-40,-35 40,-35 40,0" fill="none" stroke="#aee7d5" stroke-width="2.5" opacity="0.4"/>
    <!-- Mic Head -->
    <rect x="-20" y="-48" width="40" height="52" rx="20" fill="#ffffff" opacity="0.95"/>
    <line x1="-20" y1="-30" x2="20" y2="-30" stroke="#193339" stroke-width="2.5"/>
    <line x1="-20" y1="-16" x2="20" y2="-16" stroke="#193339" stroke-width="2.5"/>
    <path d="M-30,-18 C-30,20 30,20 30,-18" fill="none" stroke="#aee7d5" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="0" y2="44" stroke="#aee7d5" stroke-width="4"/>
    <line x1="-18" y1="44" x2="18" y2="44" stroke="#aee7d5" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Badge -->
  <rect x="200" y="222" width="240" height="28" rx="14" fill="#aee7d5" opacity="0.2"/>
  <rect x="201" y="223" width="238" height="26" rx="13" fill="none" stroke="#aee7d5" stroke-width="1.5"/>
  <text x="320" y="241" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#aee7d5" letter-spacing="2">OFFICIAL ORIENTATION · SPRING 26</text>
  
  <!-- Event Title -->
  <text x="320" y="295" text-anchor="middle" font-family="'Manrope', Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff">Prelude Spring '26</text>
  <text x="320" y="326" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="500" fill="#acd1cf">Freshman Induction Ceremony · Lead Stage Anchor</text>
  
  <!-- Photo hint -->
  <rect x="200" y="352" width="240" height="26" rx="8" fill="#ffffff" opacity="0.08"/>
  <text x="320" y="369" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#759b99">📷 Photo Placeholder · Replace with JPG</text>
</svg>