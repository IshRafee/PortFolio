<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t1 d1">
  <title id="t1">En-Queue Fall 24 Anchoring</title>
  <desc id="d1">Live stage hosting and orientation for En-Queue Fall 2024</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2456"/>
      <stop offset="100%" stop-color="#18152e"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7161ef"/>
      <stop offset="100%" stop-color="#aee7d5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg1)"/>
  <circle cx="530" cy="90" r="140" fill="#7161ef" opacity="0.18"/>
  <circle cx="110" cy="320" r="160" fill="#aee7d5" opacity="0.12"/>
  
  <!-- Spotlight Cone -->
  <polygon points="320,0 120,400 520,400" fill="#ffffff" opacity="0.04"/>
  
  <!-- Microphone & Tech graphic -->
