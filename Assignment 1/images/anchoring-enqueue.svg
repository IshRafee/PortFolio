    <line x1="0" y1="24" x2="0" y2="52" stroke="#aee7d5" stroke-width="4.5"/>
    <line x1="-22" y1="52" x2="22" y2="52" stroke="#aee7d5" stroke-width="4.5" stroke-linecap="round"/>
