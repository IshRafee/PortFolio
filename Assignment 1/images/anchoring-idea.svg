<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t6 d6">
  <title id="t6">IDEA Pitch Stage Anchoring</title>
  <desc id="d6">Innovation and entrepreneurship summit pitch stage hosting</desc>
  <defs>
