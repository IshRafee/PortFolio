    <line x1="0" y1="-75" x2="0" y2="-62" stroke="#f4d77c" stroke-width="3" stroke-linecap="round"/>
    <line x1="-42" y1="-60" x2="-32" y2="-52" stroke="#f4d77c" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="-60" x2="32" y2="-52" stroke="#f4d77c" stroke-width="3" stroke-linecap="round"/>
    <!-- Mic Head -->
    <rect x="-20" y="-48" width="40" height="52" rx="20" fill="#ffffff" opacity="0.95"/>
    <line x1="-20" y1="-30" x2="20" y2="-30" stroke="#f4d77c" stroke-width="2.5"/>
    <line x1="-20" y1="-16" x2="20" y2="-16" stroke="#f4d77c" stroke-width="2.5"/>
    <path d="M-30,-18 C-30,20 30,20 30,-18" fill="none" stroke="#f4d77c" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="0" y2="44" stroke="#f4d77c" stroke-width="4"/>
    <line x1="-18" y1="44" x2="18" y2="44" stroke="#f4d77c" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Badge -->
