      <stop offset="0%" stop-color="#352c16"/>
      <stop offset="100%" stop-color="#191712"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg6)"/>
  <circle cx="510" cy="100" r="140" fill="#f4d77c" opacity="0.18"/>
  <circle cx="120" cy="300" r="140" fill="#aee7d5" opacity="0.12"/>
  
  <polygon points="320,0 120,400 520,400" fill="#ffffff" opacity="0.04"/>
  
  <!-- Lightbulb + Pitch Mic Motif -->
  <g transform="translate(320,135)">
