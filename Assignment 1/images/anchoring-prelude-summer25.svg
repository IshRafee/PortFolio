<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t3 d3">
  <title id="t3">Prelude Summer 25 Anchoring</title>
  <desc id="d3">Official university freshman orientation stage hosting for Prelude Summer 2025</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182c44"/>
      <stop offset="100%" stop-color="#121626"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg3)"/>
  <circle cx="480" cy="90" r="150" fill="#a9d6f7" opacity="0.18"/>
  <circle cx="140" cy="300" r="140" fill="#7161ef" opacity="0.15"/>
  
  <!-- Spotlight Cone -->
  <polygon points="320,0 100,400 540,400" fill="#ffffff" opacity="0.05"/>
  
  <!-- Academic / Orientation Motif -->
  <g transform="translate(320,135)">
    <!-- Laurel Wreath -->
    <path d="M-45,15 C-65,-10 -55,-45 -25,-55" fill="none" stroke="#a9d6f7" stroke-width="3" stroke-linecap="round"/>
    <path d="M45,15 C65,-10 55,-45 25,-55" fill="none" stroke="#a9d6f7" stroke-width="3" stroke-linecap="round"/>
    <!-- Mic in Center -->
    <rect x="-20" y="-50" width="40" height="56" rx="20" fill="#ffffff" opacity="0.95"/>
    <line x1="-20" y1="-32" x2="20" y2="-32" stroke="#7161ef" stroke-width="2.5"/>
    <line x1="-20" y1="-18" x2="20" y2="-18" stroke="#7161ef" stroke-width="2.5"/>
    <path d="M-30,-20 C-30,18 30,18 30,-20" fill="none" stroke="#a9d6f7" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="0" y2="44" stroke="#a9d6f7" stroke-width="4"/>
    <line x1="-18" y1="44" x2="18" y2="44" stroke="#a9d6f7" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Badge -->
  <rect x="200" y="222" width="240" height="28" rx="14" fill="#a9d6f7" opacity="0.2"/>
  <rect x="201" y="223" width="238" height="26" rx="13" fill="none" stroke="#a9d6f7" stroke-width="1.5"/>
  <text x="320" y="241" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#a9d6f7" letter-spacing="2">OFFICIAL ORIENTATION · SUMMER 25</text>
  
  <!-- Event Title -->
  <text x="320" y="295" text-anchor="middle" font-family="'Manrope', Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff">Prelude Summer '25</text>
  <text x="320" y="326" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="500" fill="#b0c8dc">BRACU Freshman Induction · Lead Stage Host</text>
  
  <!-- Photo hint -->
  <rect x="200" y="352" width="240" height="26" rx="8" fill="#ffffff" opacity="0.08"/>
  <text x="320" y="369" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#7a90a4">📷 Photo Placeholder · Replace with JPG</text>
</svg>