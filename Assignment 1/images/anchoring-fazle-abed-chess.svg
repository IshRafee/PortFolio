  <text x="320" y="241" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#f4d77c" letter-spacing="2">NATIONAL RATED CHESS CHAMPIONSHIP</text>
  
