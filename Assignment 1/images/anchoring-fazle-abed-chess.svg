    <line x1="-18" y1="-28" x2="18" y2="-28" stroke="#ff806e" stroke-width="2.5"/>
    <line x1="-18" y1="-16" x2="18" y2="-16" stroke="#ff806e" stroke-width="2.5"/>
    <path d="M-28,-16 C-28,18 28,18 28,-16" fill="none" stroke="#f4d77c" stroke-width="4" stroke-linecap="round"/>
