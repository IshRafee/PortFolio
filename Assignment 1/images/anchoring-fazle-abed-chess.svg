  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d1d36"/>
      <stop offset="100%" stop-color="#14101a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg9)"/>
  <circle cx="510" cy="100" r="140" fill="#f4d77c" opacity="0.18"/>
  <circle cx="120" cy="300" r="140" fill="#ff806e" opacity="0.14"/>
  
  <polygon points="320,0 120,400 520,400" fill="#ffffff" opacity="0.04"/>
  
  <!-- Chess Knight / Trophy + Mic Motif -->
